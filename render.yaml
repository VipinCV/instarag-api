services:
  - type: web
    name: instarag-api
    env: docker
    dockerfilePath: ./Dockerfile
    region: singapore # Adjust this to a region closest to your DB/users
    plan: free # Free tier
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      
      # Meta / Instagram Secrets
      - key: Meta__AppId
        value: "2572236153212630"
      - key: Meta__AppSecret
        value: "823f332ad5611a2e1be16027667e6cb0"
      - key: Meta__PageAccessToken
        value: "EAAkjb2YwztYBSYZClIvjaNuZBQgTmdoQlUtXEPC3X86kD5KHrA9CMt8aUF9Hb20RTYdDRhvRE2sHWqTpbRcUg3aCJqydsD1idHm5AiAHDEZB5deZCMNhYf6ZCkjtbh6qPZAqGbVwUlAjDXYyHrEMZBJWj4ynlmKEozObckO8lX6f2ttUOZAy9QtfRAvHTGqYU1hDjr0gsQZDZD"
      - key: Meta__VerifyToken
        value: "instarag_verify_2024"
      - key: Meta__PageId
        value: "61593305486441"

      # Google Cloud / Vertex AI Configuration
      - key: GoogleCloud__ProjectId
        sync: false
      - key: GoogleCloud__Location
        value: asia-south1
      - key: GoogleCloud__RagCorpusResourceName
        sync: false
      - key: GoogleCloud__RagCorpusDisplayName
        value: my-product-catalog
      - key: GoogleCloud__GcsBucketName
        sync: false
      
      # Google Cloud Service Account JSON (injected as unescaped string)
      - key: GoogleCloud__ServiceAccountJson
        sync: false

      # Rate Limiting
      - key: RateLimit__MaxRequests
        value: 10
      - key: RateLimit__WindowSeconds
        value: 60
